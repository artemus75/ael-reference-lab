---
# infra.example.com authoritative ownership model:
# - dns-01 is the Primary and the only declarative write target.
# - dns-02 is a Secondary populated via AXFR/IXFR and NOTIFY.
# - Stable infrastructure A records are managed as desired state here.
# - Dynamic DNS updates are intentionally disabled.

- name: Create infrastructure primary zone
  ansible.builtin.uri:
    url: "{{ technitium_api_url }}/api/zones/create"
    method: POST
    headers:
      Authorization: "Bearer {{ technitium_config_login.json.token }}"
    body_format: form-urlencoded
    body:
      zone: "{{ technitium_infra_zone }}"
      type: "Primary"
    return_content: true
    status_code: 200
  register: technitium_infra_zone_create
  when:
    - inventory_hostname == technitium_infra_primary
    - not technitium_infra_zone_exists
  changed_when: technitium_infra_zone_create.json.status == "ok"
  no_log: true

- name: Get infrastructure primary zone options
  ansible.builtin.uri:
    url: "{{ technitium_api_url }}/api/zones/options/get"
    method: GET
    headers:
      Authorization: "Bearer {{ technitium_config_login.json.token }}"
    body_format: form-urlencoded
    body:
      zone: "{{ technitium_infra_zone }}"
    return_content: true
    status_code: 200
  register: technitium_infra_zone_options
  changed_when: false
  when:
    - inventory_hostname == technitium_infra_primary
  no_log: true

- name: Configure infrastructure primary zone options
  ansible.builtin.uri:
    url: "{{ technitium_api_url }}/api/zones/options/set"
    method: POST
    headers:
      Authorization: "Bearer {{ technitium_config_login.json.token }}"
    body_format: form-urlencoded
    body:
      zone: "{{ technitium_infra_zone }}"
      zoneTransfer: "UseSpecifiedNetworkACL"
      zoneTransferNetworkACL: "{{ technitium_infra_secondary_ip }}"
      notify: "SpecifiedNameServers"
      notifyNameServers: "{{ technitium_infra_secondary_ip }}"
      update: "Deny"
    return_content: true
    status_code: 200
  register: technitium_infra_zone_options_set
  when:
    - inventory_hostname == technitium_infra_primary
    - >-
      (not technitium_infra_zone_exists) or
      (
        technitium_infra_zone_options is defined and
        (
          technitium_infra_zone_options.json.response.zoneTransfer != "UseSpecifiedNetworkACL" or
          technitium_infra_zone_options.json.response.zoneTransferNetworkACL != [technitium_infra_secondary_ip] or
          technitium_infra_zone_options.json.response.notify != "SpecifiedNameServers" or
          technitium_infra_zone_options.json.response.notifyNameServers != [technitium_infra_secondary_ip] or
          technitium_infra_zone_options.json.response['update'] != "Deny"
        )
      )
  changed_when: technitium_infra_zone_options_set.json.status == "ok"
  no_log: true

- name: Show infrastructure primary zone options
  ansible.builtin.debug:
    msg:
      zone: "{{ technitium_infra_zone }}"
      zoneTransfer: "{{ technitium_infra_zone_options.json.response['zoneTransfer'] | default('UNDEFINED') }}"
      zoneTransferNetworkACL: "{{ technitium_infra_zone_options.json.response['zoneTransferNetworkACL'] | default('UNDEFINED') }}"
      notify: "{{ technitium_infra_zone_options.json.response['notify'] | default('UNDEFINED') }}"
      notifyNameServers: "{{ technitium_infra_zone_options.json.response['notifyNameServers'] | default('UNDEFINED') }}"
      update: "{{ technitium_infra_zone_options.json.response['update'] | default('UNDEFINED') }}"
  when:
    - inventory_hostname == technitium_infra_primary

- name: Create infrastructure secondary zone
  ansible.builtin.uri:
    url: "{{ technitium_api_url }}/api/zones/create"
    method: POST
    headers:
      Authorization: "Bearer {{ technitium_config_login.json.token }}"
    body_format: form-urlencoded
    body:
      zone: "{{ technitium_infra_zone }}"
      type: "Secondary"
      primaryNameServerAddresses: "{{ technitium_infra_primary_ip }}"
      zoneTransferProtocol: "Tcp"
    return_content: true
    status_code: 200
  register: technitium_infra_secondary_create
  when:
    - inventory_hostname != technitium_infra_primary
    - not technitium_infra_zone_exists
  changed_when: technitium_infra_secondary_create.json.status == "ok"
  no_log: true

- name: Get existing infrastructure A records
  ansible.builtin.uri:
    url: "{{ technitium_api_url }}/api/zones/records/get"
    method: GET
    headers:
      Authorization: "Bearer {{ technitium_config_login.json.token }}"
    body_format: form-urlencoded
    body:
      domain: "{{ item.name }}"
      zone: "{{ technitium_infra_zone }}"
      type: "{{ item.type }}"
    return_content: true
    status_code: 200
  loop: "{{ technitium_infra_records }}"
  register: technitium_infra_existing_records
  changed_when: false
  when:
    - inventory_hostname == technitium_infra_primary
  no_log: true

- name: Validate infrastructure A record cardinality
  ansible.builtin.assert:
    that:
      - item.json.response.records | length <= 1
    fail_msg: >-
      Expected at most one A record for {{ item.item.name }},
      but Technitium returned {{ item.json.response.records | length }}.
      Manual review required.
    quiet: true
  loop: "{{ technitium_infra_existing_records.results | default([]) }}"
  when:
    - inventory_hostname == technitium_infra_primary

# ------------------------------------------------------------
# Infrastructure zone apex discovery
# ------------------------------------------------------------

- name: Get infrastructure zone apex records
  ansible.builtin.uri:
    url: "{{ technitium_api_url }}/api/zones/records/get"
    method: POST
    headers:
      Authorization: "Bearer {{ technitium_config_login.json.token }}"
    body_format: form-urlencoded
    body:
      domain: "{{ technitium_infra_zone }}"
      zone: "{{ technitium_infra_zone }}"
    return_content: true
    status_code: 200
  register: technitium_infra_apex_records
  when: inventory_hostname == technitium_infra_primary
  changed_when: false
  no_log: true

- name: Validate infrastructure zone apex discovery
  ansible.builtin.assert:
    that:
      - technitium_infra_apex_records.json.status == "ok"
      - technitium_infra_apex_records.json.response is defined
      - technitium_infra_apex_records.json.response.records is defined
    fail_msg: "Technitium infrastructure zone apex discovery failed."
  when: inventory_hostname == technitium_infra_primary

- name: Show infrastructure zone apex SOA and NS records
  ansible.builtin.debug:
    msg: >-
      {{
        technitium_infra_apex_records.json.response.records
        | selectattr('type', 'in', ['SOA', 'NS'])
        | list
      }}
  when: inventory_hostname == technitium_infra_primary

# ------------------------------------------------------------
# Infrastructure SOA desired-state management
# ------------------------------------------------------------

- name: Validate infrastructure SOA cardinality
  ansible.builtin.assert:
    that:
      - >-
        (
          technitium_infra_apex_records.json.response.records
          | selectattr('type', 'equalto', 'SOA')
          | list
          | length
        ) == 1
    fail_msg: "Expected exactly one SOA record at the infrastructure zone apex."
  when: inventory_hostname == technitium_infra_primary

- name: Extract infrastructure SOA record
  ansible.builtin.set_fact:
    technitium_infra_current_soa: >-
      {{
        (
          technitium_infra_apex_records.json.response.records
          | selectattr('type', 'equalto', 'SOA')
          | list
        )[0]
      }}
  when: inventory_hostname == technitium_infra_primary

- name: Inspect infrastructure SOA desired-state comparison
  ansible.builtin.debug:
    msg:
      primaryNameServer:
        actual: "{{ technitium_infra_current_soa.rData.primaryNameServer }}"
        desired: "{{ technitium_infra_soa.primary_name_server }}"
      responsiblePerson:
        actual: "{{ technitium_infra_current_soa.rData.responsiblePerson }}"
        desired: "{{ technitium_infra_soa.responsible_person }}"
      refresh:
        actual: "{{ technitium_infra_current_soa.rData.refresh }}"
        desired: "{{ technitium_infra_soa.refresh }}"
      retry:
        actual: "{{ technitium_infra_current_soa.rData.retry }}"
        desired: "{{ technitium_infra_soa.retry }}"
      expire:
        actual: "{{ technitium_infra_current_soa.rData.expire }}"
        desired: "{{ technitium_infra_soa.expire }}"
      minimum:
        actual: "{{ technitium_infra_current_soa.rData.minimum }}"
        desired: "{{ technitium_infra_soa.minimum }}"
  when: inventory_hostname == technitium_infra_primary

- name: Reconcile infrastructure SOA desired state
  ansible.builtin.uri:
    url: "{{ technitium_api_url }}/api/zones/records/update"
    method: POST
    headers:
      Authorization: "Bearer {{ technitium_config_login.json.token }}"
    body_format: form-urlencoded
    body:
      domain: "{{ technitium_infra_zone }}"
      zone: "{{ technitium_infra_zone }}"
      type: "SOA"
      ttl: "{{ technitium_infra_current_soa.ttl | string }}"
      primaryNameServer: "{{ technitium_infra_soa.primary_name_server }}"
      responsiblePerson: "{{ technitium_infra_soa.responsible_person }}"
      serial: "{{ technitium_infra_current_soa.rData.serial | string }}"
      refresh: "{{ technitium_infra_soa.refresh | string }}"
      retry: "{{ technitium_infra_soa.retry | string }}"
      expire: "{{ technitium_infra_soa.expire | string }}"
      minimum: "{{ technitium_infra_soa.minimum | string }}"
    return_content: true
    status_code: 200
  register: technitium_infra_soa_update
  when:
    - inventory_hostname == technitium_infra_primary
    - >-
      technitium_infra_current_soa.rData.primaryNameServer != technitium_infra_soa.primary_name_server
      or technitium_infra_current_soa.rData.responsiblePerson != technitium_infra_soa.responsible_person
      or (technitium_infra_current_soa.rData.refresh | int) != (technitium_infra_soa.refresh | int)
      or (technitium_infra_current_soa.rData.retry | int) != (technitium_infra_soa.retry | int)
      or (technitium_infra_current_soa.rData.expire | int) != (technitium_infra_soa.expire | int)
      or (technitium_infra_current_soa.rData.minimum | int) != (technitium_infra_soa.minimum | int)
  changed_when: technitium_infra_soa_update.json.status == "ok"
  no_log: true

- name: Extract infrastructure NS records
  ansible.builtin.set_fact:
    technitium_infra_current_ns_records: >-
      {{
        technitium_infra_apex_records.json.response.records
        | selectattr('type', 'equalto', 'NS')
        | list
      }}
  when: inventory_hostname == technitium_infra_primary

- name: Validate infrastructure NS record state
  ansible.builtin.assert:
    that:
      - technitium_infra_current_ns_records | length >= 1
    fail_msg: "Expected at least one NS record at the infrastructure zone apex."
  when: inventory_hostname == technitium_infra_primary

- name: Add missing infrastructure NS records
  ansible.builtin.uri:
    url: "{{ technitium_api_url }}/api/zones/records/add"
    method: POST
    headers:
      Authorization: "Bearer {{ technitium_config_login.json.token }}"
    body_format: form-urlencoded
    body:
      domain: "{{ technitium_infra_zone }}"
      zone: "{{ technitium_infra_zone }}"
      type: "NS"
      nameServer: "{{ item }}"
      ttl: "14400"
    return_content: true
    status_code: 200
  loop: "{{ technitium_infra_name_servers }}"
  register: technitium_infra_ns_add
  when:
    - inventory_hostname == technitium_infra_primary
    - >-
      item not in
      (
        technitium_infra_current_ns_records
        | map(attribute='rData.nameServer')
        | list
      )
  changed_when: technitium_infra_ns_add.json.status == "ok"
  no_log: true

- name: Remove unexpected infrastructure NS records
  ansible.builtin.uri:
    url: "{{ technitium_api_url }}/api/zones/records/delete"
    method: POST
    headers:
      Authorization: "Bearer {{ technitium_config_login.json.token }}"
    body_format: form-urlencoded
    body:
      zone: "{{ technitium_infra_zone }}"
      domain: "{{ technitium_infra_zone }}"
      type: "NS"
      nameServer: "{{ item.rData.nameServer }}"
    return_content: true
    status_code: 200
  loop: "{{ technitium_infra_current_ns_records }}"
  register: technitium_infra_ns_delete
  when:
    - inventory_hostname == technitium_infra_primary
    - item.rData.nameServer not in technitium_infra_name_servers
  changed_when: technitium_infra_ns_delete.json.status == "ok"
  no_log: true

- name: Get infrastructure NS records after configuration
  ansible.builtin.uri:
    url: "{{ technitium_api_url }}/api/zones/records/get"
    method: POST
    headers:
      Authorization: "Bearer {{ technitium_config_login.json.token }}"
    body_format: form-urlencoded
    body:
      domain: "{{ technitium_infra_zone }}"
      zone: "{{ technitium_infra_zone }}"
      type: "NS"
    return_content: true
    status_code: 200
  register: technitium_infra_ns_records_after
  changed_when: false
  when: inventory_hostname == technitium_infra_primary
  no_log: true

- name: Validate exact infrastructure NS record set
  ansible.builtin.assert:
    that:
      - >-
        (
          technitium_infra_ns_records_after.json.response.records
          | selectattr('type', 'equalto', 'NS')
          | map(attribute='rData.nameServer')
          | list
          | sort
        )
        ==
        (
          technitium_infra_name_servers
          | sort
        )
    fail_msg: "Infrastructure zone NS records do not match the declared desired state."
    quiet: true
  when: inventory_hostname == technitium_infra_primary

# ------------------------------------------------------------
# Existing infrastructure A-record management
# ------------------------------------------------------------

- name: Show infrastructure record discovery
  ansible.builtin.debug:
    msg:
      name: "{{ item.item.name }}"
      type: "{{ item.item.type }}"
      status: "{{ item.json['status'] | default('UNDEFINED') }}"
      response: "{{ item.json['response'] | default({}) }}"
  loop: "{{ technitium_infra_existing_records.results | default([]) }}"
  when:
    - inventory_hostname == technitium_infra_primary

- name: Update drifted infrastructure A records
  ansible.builtin.uri:
    url: "{{ technitium_api_url }}/api/zones/records/update"
    method: POST
    headers:
      Authorization: "Bearer {{ technitium_config_login.json.token }}"
    body_format: form-urlencoded
    body:
      domain: "{{ item.item.name }}"
      zone: "{{ technitium_infra_zone }}"
      type: "{{ item.item.type }}"
      ipAddress: "{{ item.json.response.records[0].rData.ipAddress }}"
      newIpAddress: "{{ item.item.address }}"
      ttl: "{{ item.item.ttl | string }}"
    return_content: true
    status_code: 200
  loop: "{{ technitium_infra_existing_records.results | default([]) }}"
  register: technitium_infra_record_update
  when:
    - inventory_hostname == technitium_infra_primary
    - item.json.response.records | length == 1
    - >-
      item.json.response.records[0].rData.ipAddress != item.item.address
      or
      (item.json.response.records[0].ttl | int) != (item.item.ttl | int)
  changed_when: technitium_infra_record_update.json.status == "ok"
  no_log: true

- name: Create missing infrastructure A records
  ansible.builtin.uri:
    url: "{{ technitium_api_url }}/api/zones/records/add"
    method: POST
    headers:
      Authorization: "Bearer {{ technitium_config_login.json.token }}"
    body_format: form-urlencoded
    body:
      domain: "{{ item.item.name }}"
      type: "{{ item.item.type }}"
      ipAddress: "{{ item.item.address }}"
      ttl: "{{ item.item.ttl | string }}"
    return_content: true
    status_code: 200
  loop: "{{ technitium_infra_existing_records.results | default([]) }}"
  register: technitium_infra_record_create
  when:
    - inventory_hostname == technitium_infra_primary
    - item.json.response.records | length == 0
  changed_when: technitium_infra_record_create.json.status == "ok"
  no_log: true

- name: Get infrastructure A records after configuration
  ansible.builtin.uri:
    url: "{{ technitium_api_url }}/api/zones/records/get"
    method: GET
    headers:
      Authorization: "Bearer {{ technitium_config_login.json.token }}"
    body_format: form-urlencoded
    body:
      domain: "{{ item.name }}"
      zone: "{{ technitium_infra_zone }}"
      type: "{{ item.type }}"
    return_content: true
    status_code: 200
  loop: "{{ technitium_infra_records }}"
  register: technitium_infra_records_after
  changed_when: false
  when:
    - inventory_hostname == technitium_infra_primary
  no_log: true

- name: Validate infrastructure A records desired state
  ansible.builtin.assert:
    that:
      - item.json.status == "ok"
      - item.json.response.records | length == 1
      - item.json.response.records[0].rData.ipAddress == item.item.address
      - (item.json.response.records[0].ttl | int) == (item.item.ttl | int)
    fail_msg: >-
      Infrastructure A record {{ item.item.name }} does not match
      the declared desired state.
    quiet: true
  loop: "{{ technitium_infra_records_after.results | default([]) }}"
  when:
    - inventory_hostname == technitium_infra_primary
  no_log: true
