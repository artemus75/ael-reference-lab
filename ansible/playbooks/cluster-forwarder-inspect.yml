---
- name: Inspect Technitium forwarder state
  hosts:
    - dns-lab-01
    - dns-lab-02
  gather_facts: false

  tasks:
    - name: Login to Technitium API for cluster forwarder inspection
      ansible.builtin.uri:
        url: "{{ technitium_api_url }}/api/user/login"
        method: POST
        body_format: form-urlencoded
        body:
          user: "{{ technitium_admin_user }}"
          pass: "{{ vault_technitium_admin_password }}"
        return_content: true
        status_code: 200
      register: technitium_inspect_login
      no_log: true

    - name: Get Technitium settings for cluster forwarder inspection
      ansible.builtin.uri:
        url: "{{ technitium_api_url }}/api/settings/get"
        method: GET
        headers:
          Authorization: "Bearer {{ technitium_inspect_login.json.token }}"
        return_content: true
        status_code: 200
      register: technitium_inspect_settings
      no_log: true

    - name: Show Technitium forwarder state during primary outage
      ansible.builtin.debug:
        msg:
          forwarders: "{{ technitium_inspect_settings.json.response.forwarders }}"
          forwarder_protocol: "{{ technitium_inspect_settings.json.response.forwarderProtocol }}"
