apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-csi-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nfs-csi-test
  template:
    metadata:
      labels:
        app: nfs-csi-test
      annotations:
        backup.velero.io/backup-volumes: data
    spec:
      containers:
        - name: alpine
          image: alpine:3.22
          command:
            - sh
            - -c
            - sleep 3600
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nfs-csi-test

